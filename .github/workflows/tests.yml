name: tests

on:
  push:
    branches: [feature/kronos-trader, master]
  pull_request:

jobs:
  trader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Install the trader (no torch: the slow Kronos test is deselected by default)"
        run: pip install -r requirements-trader.txt pytest
      - name: Run the trader test suite
        run: python -m pytest -q tests/trader -rs
