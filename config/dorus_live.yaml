# Live profile for the demo, version 4 (5 October 2026: no trade against the weekly; version 3, 2 October: origin target, the 1H in the bias, no W+D+4H): the third edition (config/dorus_course.yaml) with reading F of the
# source-trade suite (docs/dossiers/SOURCE_TRADES_SUITE.md), the reading that reproduces his entries and stops and that
# gave 2026 on EURUSD 23 trades, 57 %, +11.2R (docs/backtests/winrate/README.md). EURUSD only: the same reading loses on
# gold, whose target rule is still open. Every line names its source; the prop-firm guard keeps the FTMO margins.
bias:
  extra_combos_enabled: true      # M+D+4H is a match (A 01:43:00, 02:03:11)
  full_combos: [[1M, 1W, 1D], [1M, 1D, 1H], [1D, 1H]]   # version 3 (2 October): the written plan's W+D+4H combination left out:
                                              # it lost in every run on both markets (version 2 over 2023-2026: EURUSD 35 trades -3.0R,
                                              # gold 21 trades -10.1R). 7 October (Max: EURUSD trades too seldom, 3 in April-September
                                              # 2026): the daily and the hourly agreeing is a match too, at half the stake
                                              # (risk.combo_risk_multiplier). 2024-02 to 2026-09, FTMO's costs: 54 trades, 39 %, +40.9R
                                              # against 28, 46 %, +31.2R; halves +3.3 / +6.4R; April-September 2026 10 trades +5.6R
                                              # against 3, +0.8R. 4H+1H stays out: its extra trades lost (-3.5R in 2024-25). The account
                                              # replay: 2026 starts funded within 2 months 90 % (85 %), 2024-25 starts lost 1 % (1 %)
  min_matching_timeframes: 2      # 7 October: with [1D, 1H] above (the three-timeframe combinations still need their three)
  required_aligned: [1H]          # version 3: the 1H must be among the aligned timeframes (version 2 over 2023-2026: with it EURUSD +6.8R and
                                  # gold +14.8R, without it -4.5R and -7.0R). Data, not his words; the bias readings per timeframe are unchanged
  no_trade_against: [1W, 4H]        # version 4 (5 October): "Als de higher timeframe voor mij tegenzit, dan ga ik überhaupt niet een trade
                                  # plaatsen" (A 01:58:37-01:59:24). EURUSD 2023-2026: 58 trades, 55 %, +21.1R, drawdown -5.3R against 73,
                                  # 49 %, +11.8R, -11.3R (`eu_against_w_full`); chosen on EURUSD, GBPUSD agrees (kept 43, 58 %, +12.7R
                                  # against 62, +8.2R). The monthly is left out: on EURUSD the monthly-against trades won (14, 71 %)
                                  # 8 October (Max: fix it): the 4H joins the veto, with shift_flips_balance below. January-September 2026,
                                  # FTMO costs: 12 trades, 50 %, +12.9R, drawdown -1.9R against 16, 38 %, +9.1R, -2.9R; both halves
                                  # better (+1.0 / +2.8R), five losers out, one trade in. The short of 8 October (into a supply the
                                  # price had just run through) was not taken under it. README "Research 2026"
  shift_flips_balance: true       # 8 October, with the veto above: the 1H balance view turns on a close beyond the far edge of the last
                                  # gap (the balance shift the confirmation trades), so a rally that shifts the 1H ends the 1D+1H short
                                  # match before the entry; alone 15 trades, 40 %, +10.0R
confirmation:
  allow_first_candle: false
  max_touch_age_hours: 24         # 7 October: no trade in a zone first visited more than a day after it formed (2024-02 to
                                  # 2026-09, the four profiles, FTMO costs: +0.34R -> +0.47R a trade, losing months 12 -> 10 of 32,
                                  # challenge starts 2024-25 failed 15 % -> 0 %; docs/backtests/winrate/README.md "Spent zones")
  allow_balance_shift: true       # "Ik plaats meestal trades gebaseerd op een balance shift bij mijn POI" (A 01:30:56)
  allow_bms: false                # the plain break is a liquidity sweep in his reading (A 01:29:29, 01:33:47)
  accept_bos: false
  bs_threshold: gap_edge          # "sterk genoeg om boven dit balance level uit te komen" (A 01:31:52)
  confirmation_tf_mode: exact     # one entry timeframe per zone timeframe
  min_confirmation_tf:            # the written table one step up: his 1H-zone entries are 5m shifts (suite readings C, D:
    1M: 4H                        # 18 Mar 2024 at 12:40 / 1.6 pips, 11 Nov 2025 at 15:10 / 1.5 pips from his entries)
    1W: 4H
    1D: 1H
    4H: 15m
    1H: 5m
  entry_outside_zone: true        # the shift's close is often just outside the zone (A 01:18:44; his 11 Nov 2025 and K3 entries)
  one_trade_per_visit: false      # 6 October, setup B (Max: go): EURUSD re-enters a zone after a stop in the same visit and
  allow_retest: true              # trades a second visit: 2024-2026 38 trades +15.8R (31, +11.2R), 2017-2023 90 trades +5.3R
                                  # (74, -2.3R); gold, NAS100 and BTC lose with it and keep the old rule
  poi_timeframes: [4H, 1H]        # 8 October: no daily zones. Under the 24 h touch rule they never traded in 2024-2026 (the rule's
                                  # clock ran from the zone candle's open, which left a daily zone no hours; corrected 8 October), so
                                  # the tested set had none; with the clock right gold's one 2026 daily trade lost 1R on a $211 stop
                                  # and pushed out a +5.7R 1H trade (34 trades +25.2R against +31.9R). Older 1D zones lost in every
                                  # market (README "Older zones on the higher timeframes"). No weekly or monthly zones either: their
                                  # sweep stop and previous-extreme target do not fit
structure:
  min_gap_fraction: 0.1           # 7 October (Max: all improvements in): a gap counts from a tenth of the median candle range (the
                                  # default a fifth). 2024-02 to 2026-09 with FTMO's costs: EURUSD 28 trades, +31.2R against 30,
                                  # +27.0R (halves +0.0 / +4.2R); NAS100 38 trades, +37.3R against 31, +32.9R (+0.8 / +3.7R).
                                  # Gold (-24.7R) and BTC (-37.1R) lose with it and keep the default. README "Into the profiles"
risk:
  risk_pct: 1.5                   # 5 October, Max: 1.5 % (challenge sim, EURUSD + gold + BTC, 790 starts 2024-2026: funded 82 % vs 91 % at 1 %, phase 1 median 61 vs 116 days)
  drawdown_steps: [[-3, 1.0], [-6, 0.5]]   # 5 October: with the balance 3 % under the start a trade risks 1.0 %, from 6 % under
                                  # it 0.5 %; only the stake changes, never the trades. FTMO challenge, five markets, two open,
                                  # 790 starts 2024-2026: funded 85 % flat -> 92 %. On the funded account plan 1.0 % with
                                  # [[-3, 0.5]]: lost within a year 11 % flat -> 2 % (with every trade 0.15R worse live: 21 % -> 11 %)
  min_rr: 1.0                     # 6 October, Max: judged on the recent years (the bot trades now, not 2017): EURUSD since 2024 at 0.5 / 1.0 / 1.5: 45 / 31 / 20 trades, 47 / 48 / 40 % won, +4.5 / +11.2 / +8.8R.
                                  # Over 2017-2026 the 1.5 of 5 October did better in 2017-2022 (docs/backtests/winrate/README.md)
  max_entry_depth: 0.5            # entry at most half the zone deep: the stop needs room (A 00:31:22)
  stop_basis: confirmation        # the stop beyond the sweep extreme since the re-entry: 0.3 and 1.1 pips from his on the EURUSD trades
  stop_protection: recent_1h
  sl_offset_pips: 0.0
  min_stop_pips: 8.0              # his stops are never under 9 pips; stops under 5 pips won 3 % in R6
  max_spread_stop_fraction: 0.3   # 6 October: live only, no entry while the spread is over 30 % of the stop distance (a market opening, news)
  zone_risk_multiplier: {4H: 2.0}   # 6 October, setup B (Max: go): a 4H zone risks twice risk_pct. 4H zones on EURUSD, gold and
                                  # NAS100: 47 % won, +0.49R a trade 2017-2023; 64 %, +1.04R 2024-2026 (README "Setup B")
  neutral_bias_risk_multiplier: {1M: 0.5}   # 8 October (Max: ja, long and short): a trade taken while the month reads 50/50 at half
                                  # the stake. The long losing runs came from those trades (EURUSD 11 in a row in 2024, gold 7): they
                                  # won 29-33 % against 50-60 %. Account replay at 1.5 %, 2024-02 to 2026-09: 2024-25 starts lost 4 % ->
                                  # 1 %, funded within 3 months 52 % -> 55 %, losing months 7 -> 6; 2026 within 2 months 97 % -> 96 %
  combo_risk_multiplier: {1D+1H: 0.5}   # 7 October: the daily-plus-hourly trades at half the stake: 2024-25 challenge starts lost
                                  # 1 % at 0.5 and 0.6, 3 % at 0.75, 4 % at 0.85, 6 % at full stake; 2026 within 2 months 89-90 % at each.
                                  # It falls on every trade the pair matches (44 of 54): the full combinations come before the
                                  # scalp one, so 18 the 1D+4H+1H scalp combination took at full stake before read 1D+1H now.
                                  # Only the 26 new ones at half: 2 % lost against 1 %, 2026 within 6 weeks 41 % against 37 %
  limit_entry_fraction: 0.25      # 6 October, evening (Max: decide on the last 3 years): a limit 25 % of the way back toward the stop,
  limit_entry_minutes: 240        # valid 4 hours, as NAS100. EURUSD 2024-2026: 31 trades, 45 %, +24.6R (2024 +1.7, 2025 +16.7, 2026 +6.2)
                                  # against 38, 50 %, +15.8R (-1.4 / +9.9 / +7.3); README "The last three years"
  tp_policy: impulse_origin       # version 2 (2 October): "stop loss op de low en take profit bij de vorige high" (A 00:43:39, 01:09:01,
                                  # 01:20:52, 02:45:57): the low/high the move that created the zone started from, i.e. the previous higher
                                  # low whose break is the break of market structure (A 00:14:48). Suite reading H: K3a 1.0 point and
                                  # 18 Mar 2024 3.2 pips from his targets; 11 Nov 2025 8.6 pips nearer than his (the dip after the zone
                                  # formed, open). Version 1 used previous_extreme over 72 candles before the touch (too far on gold)
  tp_origin_candles: 30           # zone-timeframe candles up to and including the zone's P candle
  tp_lookback_candles: 72         # only used by previous_extreme
  tp_buffer_pips: 0.0
  tp_max_rr: 0.0                  # no cap: his targets ran 2.0R-3.1R
  spread_buffer_pips: 1.0
session:
  enabled: true
  windows: [["09:00", "11:00"], ["13:00", "17:00"]]   # "van 9 tot 11 en van 1 uur tot 5 uur" (A 02:24:07)
  timezone: Europe/Amsterdam
news:
  enabled: true                   # no entry right before high-impact news (A 02:00:28, G 11:13)
exits:
  breakeven_r_intraday: 4.0       # the written plan: break-even after 4R intraday, 2R swing, no partials
  breakeven_r_swing: 2.0
  partials: false
prop_firm:
  max_open_trades: 2              # 5 October: two open on the account, one per market (EURUSD, gold, BTC, GBPUSD, NAS100 at 1.5 %,
  max_open_per_symbol: 1          # 790 challenge starts 2024-2026: funded 85 %, phase 1 median 42 days; one open on the account 74 %, 51 days)
  daily_loss_limit_pct: 4.0       # inside FTMO's 5 % with margin
  monthly_loss_limit_pct: 0.0     # off by Max's choice (5 October): better entries, not a stop. At 4.5 % (3R at 1.5 %), five markets, two open,
                                  # 2024-2026: worst month -11.0 % -> -5.2 %, drawdown -24 % -> -15 %, the average month +6.0 %
                                  # -> +5.6 %, 790 challenge starts funded 85 % -> 91 % (phase 1 median 42 -> 56 days); set 4.5 to
                                  # turn it on
  max_drawdown_pct: 8.0           # inside FTMO's 10 % with margin
  drawdown_basis: initial         # 5 October: FTMO's 10 % is static below the initial balance; from the peak the guard stopped
                                  # the bot after a normal swing back from a gain (8 % is 5.3R at 1.5 %) while FTMO still allowed
                                  # trading. The challenge simulations count the static rule
kronos:
  mode: "off"
live:
  dorus_check: advisory           # 8 October (Max: both checks): after an entry Claude reads the setup and its charts the way Dorus
                                  # would (docs/DORUS_REVIEW.md); the verdict goes to Telegram and dorus_checks.csv. Advice only:
                                  # the trade stands. Off until ANTHROPIC_API_KEY and DORUS_CHECK_MODEL are set on the computer
