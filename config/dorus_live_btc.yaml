# Live profile for BTCUSD on the demo, 4 October 2026: config/dorus_live.yaml (version 3) with two lines changed for BTC.
# Evidence: Bitstamp BTC/USD 2026 (5m from 20 December 2025, higher timeframes to 2015), docs/backtests/winrate/README.md:
#   - min_stop_pips 60: 8 pips on EURUSD is 0.07 % of price; 0.07 % of BTC at 85,000 is 60 USD (a "pip" is 1 USD here).
#   - required_aligned []: with the 1H required 25 trades, 40 %, +15.8R; without it 31 trades, 45 %, +26.6R (the ten added
#     trades +9.5R, the M+W+D swing combination works on BTC). A 2026-only finding on 31 trades: the demo decides.
#   Kept as in the live profile: the sessions (trading BTC around the clock lost 8.3 % by February and halted the run),
#   the 1D/4H/1H zones (15m zones with 1m entries added one losing trade), max 1 open trade (two lost -4.8R).
bias:
  extra_combos_enabled: true      # M+D+4H is a match (A 01:43:00, 02:03:11)
  full_combos: [[1M, 1W, 1D], [1M, 1D, 1H]]   # version 3 (2 October): the written plan's W+D+4H combination left out: it lost in every run on
                                              # both markets (version 2 over 2023-2026: EURUSD 35 trades -3.0R, gold 21 trades -10.1R)
  required_aligned: []            # version 3: the 1H must be among the aligned timeframes (version 2 over 2023-2026: with it EURUSD +6.8R and
                                  # gold +14.8R, without it -4.5R and -7.0R). Data, not his words; the bias readings per timeframe are unchanged
confirmation:
  allow_first_candle: false
  allow_balance_shift: true       # "Ik plaats meestal trades gebaseerd op een balance shift bij mijn POI" (A 01:30:56)
  allow_bms: false                # the plain break is a liquidity sweep in his reading (A 01:29:29, 01:33:47)
  accept_bos: false
  bs_threshold: gap_edge          # "sterk genoeg om boven dit balance level uit te komen" (A 01:31:52)
  confirmation_tf_mode: exact     # one entry timeframe per zone timeframe
  min_confirmation_tf:            # the written table one step up: his 1H-zone entries are 5m shifts (suite readings C, D:
    1M: 4H                        # 18 Mar 2024 at 12:40 / 1.6 pips, 11 Nov 2025 at 15:10 / 1.5 pips from his entries)
    1W: 4H
    1D: 1H
    4H: 15m
    1H: 5m
  entry_outside_zone: true        # the shift's close is often just outside the zone (A 01:18:44; his 11 Nov 2025 and K3 entries)
  one_trade_per_visit: true       # a stopped zone is not re-entered in the same visit (R6: re-entries won 9 %)
  poi_timeframes: [1D, 4H, 1H]    # no weekly or monthly zones in the demo: their sweep stop and previous-extreme target do not fit
                                  # (a weekly zone sat open from June 2025 to September 2026 in the full-period run of this reading)
risk:
  risk_pct: 1.0
  min_rr: 0.5                     # "boven de 0,5" from his 70 % win rate (A 01:44:08-01:45:07)
  max_entry_depth: 0.5            # entry at most half the zone deep: the stop needs room (A 00:31:22)
  stop_basis: confirmation        # the stop beyond the sweep extreme since the re-entry: 0.3 and 1.1 pips from his on the EURUSD trades
  stop_protection: recent_1h
  sl_offset_pips: 0.0
  min_stop_pips: 60.0              # his stops are never under 9 pips; stops under 5 pips won 3 % in R6
  tp_policy: impulse_origin       # version 2 (2 October): "stop loss op de low en take profit bij de vorige high" (A 00:43:39, 01:09:01,
                                  # 01:20:52, 02:45:57): the low/high the move that created the zone started from, i.e. the previous higher
                                  # low whose break is the break of market structure (A 00:14:48). Suite reading H: K3a 1.0 point and
                                  # 18 Mar 2024 3.2 pips from his targets; 11 Nov 2025 8.6 pips nearer than his (the dip after the zone
                                  # formed, open). Version 1 used previous_extreme over 72 candles before the touch (too far on gold)
  tp_origin_candles: 30           # zone-timeframe candles up to and including the zone's P candle
  tp_lookback_candles: 72         # only used by previous_extreme
  tp_buffer_pips: 0.0
  tp_max_rr: 0.0                  # no cap: his targets ran 2.0R-3.1R
  spread_buffer_pips: 1.0
session:
  enabled: true
  windows: [["09:00", "11:00"], ["13:00", "17:00"]]   # "van 9 tot 11 en van 1 uur tot 5 uur" (A 02:24:07)
  timezone: Europe/Amsterdam
news:
  enabled: true                   # no entry right before high-impact news (A 02:00:28, G 11:13)
exits:
  breakeven_r_intraday: 4.0       # the written plan: break-even after 4R intraday, 2R swing, no partials
  breakeven_r_swing: 2.0
  partials: false
prop_firm:
  max_open_trades: 1
  daily_loss_limit_pct: 4.0       # inside FTMO's 5 % with margin
  max_drawdown_pct: 8.0           # inside FTMO's 10 % with margin
kronos:
  mode: "off"
