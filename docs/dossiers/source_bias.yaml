# Dorus's bias readings per day, for scripts/bias_suite.py: his bias per timeframe (bullish / bearish / 50-50) on a dated day,
# from the academy recaps or his videos, next to what the engine reads at 09:00 Amsterdam that day. Fill as they come in.
# Example record (the 11 Nov 2025 EURUSD short: he read M/W/D bearish, the course shows the dollar index for that period):
- date: "2025-11-11"
  symbol: EURUSD
  his: {1M: bearish, 1W: bearish, 1D: bearish, 4H: bearish, 1H: bearish}
  match: "bearish"
  traded: "short 15:05 UTC (source trade EU-2025-11-11)"
  source: "his recap screenshot; M/W/D from the DXY mirror (not confirmed as a rule)"
